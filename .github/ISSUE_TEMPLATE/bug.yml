name: 🐛 Bug
description: Algo não funciona como deveria
labels: [bug]
body:
  - type: textarea
    id: oque
    attributes:
      label: O que aconteceu?
      description: Descreva o problema. Se puder, cole um print.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abri a fase 3 (Portão dos Oráculos)
        2. Escrevi ...
        3. Cliquei em Rodar testes
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava?
  - type: input
    id: ambiente
    attributes:
      label: Navegador e sistema
      placeholder: Chrome 131 no Windows 11 / Safari no iPhone
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do jogo
      description: 'Aparece no rodapé do menu (ex.: v6.0.0)'
